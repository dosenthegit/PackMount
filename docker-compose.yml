services:
  packmount:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: packmount
    restart: unless-stopped
    privileged: true
    cap_add:
      - SYS_ADMIN
      - MKNOD
    devices:
      - /dev/fuse:/dev/fuse
    security_opt:
      - apparmor:unconfined
    env_file:
      - .env
    ports:
      - "8080:8080"
      - "445:445/tcp"
      - "139:139/tcp"
      - "111:111/tcp"
      - "111:111/udp"
      - "2049:2049/tcp"
      - "2049:2049/udp"
      - "20048:20048/tcp"
      - "20048:20048/udp"
    volumes:
      - type: bind
        source: ./config
        target: /config
      - type: bind
        source: ./data
        target: /data
        bind:
          propagation: rshared
      - type: bind
        source: ./mounts
        target: /mnt/packmount
        bind:
          propagation: rshared
